<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password — Smart Trade Journal</title>
<style>

:root{--bg:#090b10;--panel:#11151d;--line:#222834;--text:#eef2f8;--muted:#8f99aa;--violet:#7657ff;--green:#31d58a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}
a{color:#a997ff;text-decoration:none} a:hover{text-decoration:underline}
.top{height:62px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;background:rgba(9,11,16,.94);backdrop-filter:blur(10px)}
.brand{font-weight:800;color:var(--text);text-decoration:none}.brand span{color:#9b87ff}
.wrap{width:min(900px,calc(100% - 32px));margin:48px auto 80px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:30px}
.tag{display:inline-block;border:1px solid #3d356c;background:#17132c;color:#b8aaff;border-radius:999px;padding:6px 10px;font-size:11px;font-weight:700}
h1{font-size:38px;margin:14px 0 8px}h2{font-size:18px;margin:30px 0 10px}p,li{color:var(--muted);font-size:13px;line-height:1.75}
.note{padding:14px;border:1px solid #3c4136;background:#14170f;border-radius:10px;color:#cbd5b8;font-size:12px;line-height:1.6}
.footer{margin-top:24px;color:#6f7888;font-size:11px}

.form{max-width:460px;margin:0 auto} .field{margin:15px 0}
label{display:block;font-size:11px;color:#a9b2c0;margin-bottom:7px}
input{width:100%;border:1px solid #2b3240;background:#0c1016;color:#eef2f8;border-radius:10px;padding:12px 13px;outline:none}
button{width:100%;border:0;background:#7657ff;color:white;border-radius:10px;padding:12px;font-weight:800;cursor:pointer}
.msg{display:none;margin-top:14px;padding:11px;border-radius:9px;font-size:11px;line-height:1.5}
.ok{border:1px solid #245840;background:#0d2118;color:#8fe0b7} .err{border:1px solid #63343b;background:#251014;color:#ff9ba2}
</style>
</head>
<body>
<header class="top"><a class="brand" href="index.html">Smart Trade <span>Journal</span></a><a href="login.html">Back to login</a></header>
<main class="wrap"><article class="card form">
<span class="tag">ACCOUNT RECOVERY</span>
<div id="requestBox">
<h1>Reset password</h1>
<p>Enter the email used for your Smart Trade Journal account. We will send a password-reset link.</p>
<div class="field"><label>Email</label><input id="resetEmail" type="email" placeholder="you@example.com"></div>
<button id="sendReset">Send reset link</button>
</div>

<div id="newPasswordBox" style="display:none">
<h1>Choose a new password</h1>
<p>Enter a new password for your Smart Trade Journal account.</p>
<div class="field"><label>New password</label><input id="newPassword" type="password" minlength="6" placeholder="Minimum 6 characters"></div>
<div class="field"><label>Confirm password</label><input id="confirmNewPassword" type="password" minlength="6" placeholder="Repeat password"></div>
<button id="updatePassword">Update password</button>
</div>

<div class="msg ok" id="okMsg"></div>
<div class="msg err" id="errMsg"></div>
<div class="footer"><a href="terms.html">Terms</a> · <a href="privacy.html">Privacy</a></div>
</article></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://vboelobxtkgewkwxllsq.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_SKqSLtBziCxy7JRe4PdUeA_nZKRoO4i";
const RESET_REDIRECT_URL = "https://rahul0250-afk.github.io/smart-trade-journal/reset-password.html";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

const requestBox = document.getElementById("requestBox");
const newPasswordBox = document.getElementById("newPasswordBox");
const okMsg = document.getElementById("okMsg");
const errMsg = document.getElementById("errMsg");

function showOk(message) {
  okMsg.textContent = message; okMsg.style.display = "block"; errMsg.style.display = "none";
}
function showErr(message) {
  errMsg.textContent = message; errMsg.style.display = "block"; okMsg.style.display = "none";
}
function showNewPassword() {
  requestBox.style.display = "none";
  newPasswordBox.style.display = "block";
}

async function detectRecovery() {
  const hash = new URLSearchParams(location.hash.slice(1));
  const query = new URLSearchParams(location.search);
  if (hash.get("type") === "recovery" || query.get("type") === "recovery") {
    showNewPassword();
    return;
  }
  try {
    const { data } = await sb.auth.getSession();
    if (data.session && location.hash) showNewPassword();
  } catch (e) {}
}

sb.auth.onAuthStateChange((event, session) => {
  if (event === "PASSWORD_RECOVERY") showNewPassword();
});

document.getElementById("sendReset").addEventListener("click", async () => {
  const email = document.getElementById("resetEmail").value.trim();
  if (!email || !email.includes("@")) {
    showErr("Enter a valid email address.");
    return;
  }
  const btn = document.getElementById("sendReset");
  btn.disabled = true; btn.textContent = "Sending...";
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: RESET_REDIRECT_URL });
  btn.disabled = false; btn.textContent = "Send reset link";
  if (error) return showErr(error.message);
  showOk("If an account exists for that email, a reset link has been sent.");
});

document.getElementById("updatePassword").addEventListener("click", async () => {
  const password = document.getElementById("newPassword").value;
  const confirm = document.getElementById("confirmNewPassword").value;
  if (password.length < 6) return showErr("Password must be at least 6 characters.");
  if (password !== confirm) return showErr("Passwords do not match.");
  const btn = document.getElementById("updatePassword");
  btn.disabled = true; btn.textContent = "Updating...";
  const { error } = await sb.auth.updateUser({ password });
  btn.disabled = false; btn.textContent = "Update password";
  if (error) return showErr(error.message);
  showOk("Password updated. Opening login...");
  try { await sb.auth.signOut({ scope: "local" }); } catch (e) {}
  setTimeout(() => location.href = "login.html", 1000);
});

detectRecovery();
</script>
</body></html>
